[workspace]
members = [
    "pow",
    "wasm",
    "nonce"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2"
authors = ["Jerome David <programingjd@gmail.com>"]
repository = "https://github.com/id-entity-org/automation-mitigation"

[workspace.dependencies.tiny-keccak]
version = "2.0"
default-features = false
features = ["cshake"]

[workspace.dependencies.rs_merkle]
git = "https://github.com/programingjd/rs-merkle.git"
rev = "798b6b0"
#version = "1.5"
default-features = false
features = []

[profile.dev]
opt-level = 3
lto = "fat"
debug = true
debug-assertions = true
overflow-checks = true

[profile.test]
inherits = "dev"